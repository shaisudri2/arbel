<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f766e" />
  <title>ארבל – סידור עבודה</title>
  <style>
:root {
  --bg:#f5f7fb; --card:#fff; --text:#172033; --muted:#667085; --line:#e4e7ec;
  --primary:#0f766e; --primary2:#115e59; --accent:#e6fffb; --danger:#b42318;
  --warn:#b54708; --ok:#067647; --shadow:0 10px 30px rgba(16,24,40,.08);
}
*{box-sizing:border-box} body{margin:0;font-family:Arial,"Noto Sans Hebrew",sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit} button{cursor:pointer}.shell{max-width:1380px;margin:auto;padding:20px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--primary),#22c55e);color:white;display:grid;place-items:center;font-weight:800;font-size:20px}.brand h1{margin:0;font-size:23px}.small{font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(520px,100%)}.login-card h1{margin:0 0 6px}.stack{display:grid;gap:12px}.field{display:grid;gap:6px}.field label{font-size:14px;font-weight:700}.field input,.field select{width:100%;padding:11px 12px;border:1px solid #d0d5dd;border-radius:10px;background:white;outline:none}.field input:focus,.field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(15,118,110,.12)}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;background:#eef2f6;color:#344054}.btn.primary{background:var(--primary);color:#fff}.btn.primary:hover{background:var(--primary2)}.btn.danger{background:#fee4e2;color:var(--danger)}.btn.ghost{background:transparent;border:1px solid var(--line)}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.smallbtn{padding:6px 9px;font-size:12px}
.notice{padding:10px 12px;border-radius:10px;font-size:14px}.notice.info{background:#eff8ff;color:#175cd3}.notice.error{background:#fef3f2;color:var(--danger)}.notice.ok{background:#ecfdf3;color:var(--ok)}.notice.warn{background:#fffaeb;color:var(--warn)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab{border:1px solid var(--line);background:white;border-radius:999px;padding:9px 14px;font-weight:700;color:#475467}.tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}.toolbar .group{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.week-title{font-weight:800;font-size:18px}
.schedule-grid{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:12px;overflow:auto;padding-bottom:8px}.day-card{min-width:220px;background:white;border:1px solid var(--line);border-radius:16px;padding:12px}.day-card h3{margin:0 0 4px;font-size:16px}.date{color:var(--muted);font-size:12px;margin-bottom:10px}.station{border:1px dashed #cfd4dc;border-radius:12px;padding:10px;margin-top:9px}.station-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.station-title{font-weight:800}.capacity{font-size:12px;color:var(--muted)}.capacity.full{color:var(--ok);font-weight:700}.capacity.over{color:var(--danger);font-weight:700}
.person-chip{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 8px;background:#f8fafc;border:1px solid var(--line);border-radius:9px;margin-top:6px;font-size:13px}.person-chip.off{background:#fff6ed;color:#9a3412}.xbtn{border:0;background:transparent;color:var(--danger);font-weight:900}.empty{color:#98a2b3;font-size:13px;padding:7px 0}.assign-row{display:flex;gap:6px;margin-top:8px}.assign-row select{flex:1;min-width:0;border:1px solid #d0d5dd;border-radius:8px;padding:7px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}.three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.metric{padding:16px}.metric .num{font-size:28px;font-weight:900;margin-top:6px}.metric .label{color:var(--muted);font-size:13px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:680px}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:right;font-size:14px}.table th{color:#475467;background:#f9fafb}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:700}.badge.pending{background:#fffaeb;color:#b54708}.badge.approved{background:#ecfdf3;color:#067647}.badge.rejected{background:#fef3f2;color:#b42318}.badge.manager{background:#ecfdf3;color:#067647}.badge.employee{background:#eff8ff;color:#175cd3}
.modal-backdrop{position:fixed;inset:0;background:rgba(16,24,40,.45);display:grid;place-items:center;padding:20px;z-index:50}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:white;border-radius:18px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.2)}.modal h2{margin-top:0}.actions{display:flex;gap:8px;justify-content:flex-start;flex-wrap:wrap}.divider{height:1px;background:var(--line);margin:14px 0}.muted{color:var(--muted)}
@media(max-width:1000px){.schedule-grid{grid-template-columns:repeat(5,260px)}.two-col,.three-col{grid-template-columns:1fr}}@media(max-width:600px){.shell{padding:12px}.topbar{align-items:flex-start}.brand h1{font-size:19px}.card{padding:14px}.toolbar{align-items:flex-start}}

</style>
</head>
<body>
  <div id="app"></div>
  <script>
'use strict';

const EMPLOYEES = ['מלקם','דבורה','מוריאל','נועם ג','נועם','בוסנה','הודיה','זיו כ','זיו ר','מרצי','עדי','אבישג','גנית','ירדן ד','ירדן י','חני','מנשה','ששון','שירן','הודיה מ'];
const DAYS = [0,1,2,3,4]; // Sunday-Thursday
const STATIONS = [{id:'stationA', name:'עמדה א׳', capacity:4},{id:'stationB', name:'עמדה ב׳', capacity:2}];
const DB_KEY = 'arbel_app_v1';
let state = loadState();
let session = null;
let currentWeek = weekStart(new Date());
let activeTab = 'schedule';
let modal = null;

function defaultState(){
  const users = {};
  EMPLOYEES.forEach(name => users[name] = {name, role:'employee', salt:null, pinHash:null});
  users['מנהל'] = {name:'מנהל', role:'manager', salt:null, pinHash:null};
  return {users, schedules:{}, offDays:{}, swaps:[], audit:[]};
}
function loadState(){
  try { const x = JSON.parse(localStorage.getItem(DB_KEY)); return migrate(x); } catch { return defaultState(); }
}
function migrate(x){
  if(!x || !x.users) return defaultState();
  const base = defaultState();
  for(const name of Object.keys(base.users)) if(!x.users[name]) x.users[name]=base.users[name];
  x.schedules ||= {}; x.offDays ||= {}; x.swaps ||= []; x.audit ||= [];
  return x;
}
function save(){ localStorage.setItem(DB_KEY, JSON.stringify(state)); }
function esc(s=''){ return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
function pad(n){return String(n).padStart(2,'0')}
function dateKey(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function parseKey(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}
function formatDate(d){return d.toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit',year:'numeric'})}
function dayName(d){return d.toLocaleDateString('he-IL',{weekday:'long'})}
function weekStart(date){ const d=new Date(date); d.setHours(0,0,0,0); const diff=d.getDay(); d.setDate(d.getDate()-diff); return d; }
function addDays(d,n){const x=new Date(d); x.setDate(x.getDate()+n); return x}
function scheduleFor(k){return state.schedules[k] || {stationA:[],stationB:[]}}
function isOff(name,k){return !!(state.offDays[k]||[]).includes(name)}
function assignedElsewhere(name,k,stationId){const s=scheduleFor(k); return STATIONS.some(st=>st.id!==stationId && s[st.id].includes(name))}
function anyAssignment(name,k){const s=scheduleFor(k); return STATIONS.some(st=>s[st.id].includes(name))}
function audit(action, detail){state.audit.unshift({id:crypto.randomUUID(),ts:new Date().toISOString(),by:session?.name||'מערכת',action,detail}); state.audit=state.audit.slice(0,300);}

async function hashPin(pin,salt){
  const enc = new TextEncoder();
  const material = await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:150000,hash:'SHA-256'},material,256);
  return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function newSalt(){const a=new Uint8Array(16);crypto.getRandomValues(a);return [...a].map(b=>b.toString(16).padStart(2,'0')).join('')}

function render(){
  const app=document.getElementById('app');
  if(!session){ app.innerHTML=loginHtml(); bindLogin(); return; }
  app.innerHTML=mainHtml(); bindMain(); if(modal) renderModal();
}
function loginHtml(){
  const options=['מנהל',...EMPLOYEES].map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('');
  return `<div class="login-wrap"><div class="card login-card"><div class="brand"><div class="logo">א</div><div><h1>ארבל</h1><div class="small">סידור עבודה חכם</div></div></div><div class="divider"></div><form id="loginForm" class="stack"><div class="field"><label>שם משתמש</label><select id="loginName">${options}</select></div><div class="field"><label>קוד PIN בן 4 ספרות</label><input id="loginPin" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="••••" required></div><div id="loginMsg"></div><button class="btn primary" type="submit">כניסה</button></form><div class="divider"></div><div class="small">בכניסה הראשונה לכל משתמש, הקוד שתזין יוגדר כ-PIN האישי שלו. נשמר רק Hash מאובטח ולא הקוד עצמו.</div></div></div>`;
}
function bindLogin(){
  document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault(); const name=document.getElementById('loginName').value; const pin=document.getElementById('loginPin').value; const msg=document.getElementById('loginMsg');
    if(!/^\d{4}$/.test(pin)){msg.innerHTML='<div class="notice error">יש להזין 4 ספרות.</div>';return}
    const u=state.users[name];
    if(!u.pinHash){u.salt=newSalt();u.pinHash=await hashPin(pin,u.salt);audit('הגדרת PIN ראשונית',name);save();session={name,role:u.role};render();return}
    const h=await hashPin(pin,u.salt); if(h!==u.pinHash){msg.innerHTML='<div class="notice error">PIN שגוי.</div>';return}
    session={name,role:u.role};render();
  }
}
function mainHtml(){
  const manager=session.role==='manager';
  const tabs=[['schedule','סידור שבועי'],['swaps','החלפות'],['reports','דוחות'],...(manager?[['employees','עובדים']]:[])];
  return `<div class="shell"><div class="topbar"><div class="brand"><div class="logo">א</div><div><h1>ארבל – סידור עבודה</h1><div class="small">${manager?'חשבון מנהל':'צפייה כעובד'} · ${esc(session.name)}</div></div></div><button class="btn ghost" id="logoutBtn">יציאה</button></div><div class="tabs">${tabs.map(([id,label])=>`<button class="tab ${activeTab===id?'active':''}" data-tab="${id}">${label}</button>`).join('')}</div>${tabHtml(activeTab)}</div>`;
}
function tabHtml(tab){if(tab==='schedule')return scheduleHtml(); if(tab==='swaps')return swapsHtml(); if(tab==='reports')return reportsHtml(); return employeesHtml()}
function scheduleHtml(){
  const manager=session.role==='manager'; const end=addDays(currentWeek,4);
  const cards=DAYS.map(i=>{const d=addDays(currentWeek,i),k=dateKey(d),sch=scheduleFor(k);return `<div class="day-card"><h3>${dayName(d)}</h3><div class="date">${formatDate(d)}</div>${STATIONS.map(st=>stationHtml(k,st,sch[st.id],manager)).join('')}${manager?`<button class="btn smallbtn ghost" data-offday="${k}" style="margin-top:10px">ימי חופש</button>`:''}</div>`}).join('');
  return `<div class="toolbar"><div class="group"><button class="btn" data-week="prev">‹ שבוע קודם</button><button class="btn" data-week="today">השבוע</button><button class="btn" data-week="next">שבוע הבא ›</button></div><div class="week-title">${formatDate(currentWeek)} – ${formatDate(end)}</div>${manager?'<div class="group"><button class="btn primary" id="autoFillBtn">שיבוץ אוטומטי לחוסרים</button><button class="btn ghost" id="clearWeekBtn">נקה שבוע</button></div>':''}</div><div class="schedule-grid">${cards}</div>`;
}
function stationHtml(k,st,names,manager){
  const c=names.length, cls=c===st.capacity?'full':c>st.capacity?'over':'';
  const chips=names.length?names.map(n=>`<div class="person-chip"><span>${esc(n)}</span>${manager?`<button class="xbtn" title="הסר" data-remove="${esc(n)}" data-date="${k}" data-station="${st.id}">×</button>`:''}</div>`).join(''):'<div class="empty">אין שיבוץ</div>';
  let assign=''; if(manager){const candidates=EMPLOYEES.filter(n=>!names.includes(n)&&!isOff(n,k)&&!assignedElsewhere(n,k,st.id));assign=`<div class="assign-row"><select data-select="${k}-${st.id}"><option value="">בחר עובד…</option>${candidates.map(n=>`<option>${esc(n)}</option>`).join('')}</select><button class="btn smallbtn" data-add="${k}" data-station="${st.id}">הוסף</button></div>`}
  return `<div class="station"><div class="station-head"><div class="station-title">${st.name}</div><div class="capacity ${cls}">${c}/${st.capacity}</div></div>${chips}${assign}</div>`;
}
function swapsHtml(){
  const mine=session.role==='manager'?state.swaps:state.swaps.filter(s=>s.requester===session.name||s.target===session.name);
  const rows=mine.length?mine.map(s=>`<tr><td>${esc(s.requester)}</td><td>${formatDate(parseKey(s.date))}</td><td>${esc(STATIONS.find(x=>x.id===s.station)?.name||s.station)}</td><td>${esc(s.target||'טרם נבחר')}</td><td><span class="badge ${s.status}">${statusLabel(s.status)}</span></td><td>${session.role==='manager'&&s.status==='pending'?`<button class="btn smallbtn primary" data-swap-approve="${s.id}">אשר</button> <button class="btn smallbtn danger" data-swap-reject="${s.id}">דחה</button>`:''}</td></tr>`).join(''):'<tr><td colspan="6" class="muted">אין בקשות החלפה.</td></tr>';
  return `<div class="toolbar"><div><div class="week-title">בקשות החלפה</div><div class="small">עובד יכול לבקש החלפה; הביצוע בפועל דורש אישור מנהל.</div></div>${session.role==='employee'?'<button class="btn primary" id="newSwapBtn">בקשת החלפה חדשה</button>':''}</div><div class="card table-wrap"><table class="table"><thead><tr><th>מבקש</th><th>תאריך</th><th>עמדה</th><th>מחליף</th><th>סטטוס</th><th>פעולה</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function reportsHtml(){
  const start=currentWeek,end=addDays(currentWeek,4); let filled=0,needed=5*6; const counts={}; EMPLOYEES.forEach(n=>counts[n]=0);
  for(let i=0;i<5;i++){const k=dateKey(addDays(start,i)),s=scheduleFor(k); STATIONS.forEach(st=>s[st.id].forEach(n=>{filled++;counts[n]=(counts[n]||0)+1}))}
  const offCount=Object.entries(state.offDays).filter(([k])=>{const d=parseKey(k);return d>=start&&d<=end}).reduce((a,[,v])=>a+v.length,0);
  const month=currentWeek.getMonth(),year=currentWeek.getFullYear(); const monthly={}; EMPLOYEES.forEach(n=>monthly[n]=0); Object.entries(state.schedules).forEach(([k,s])=>{const d=parseKey(k);if(d.getMonth()===month&&d.getFullYear()===year) STATIONS.forEach(st=>s[st.id].forEach(n=>monthly[n]=(monthly[n]||0)+1))});
  const rows=EMPLOYEES.map(n=>`<tr><td>${esc(n)}</td><td>${counts[n]}</td><td>${monthly[n]}</td></tr>`).join('');
  return `<div class="three-col"><div class="card metric"><div class="label">שיבוצים השבוע</div><div class="num">${filled}/${needed}</div></div><div class="card metric"><div class="label">חוסרים השבוע</div><div class="num">${Math.max(0,needed-filled)}</div></div><div class="card metric"><div class="label">ימי חופש מסומנים</div><div class="num">${offCount}</div></div></div><div class="card table-wrap" style="margin-top:14px"><div class="week-title" style="margin-bottom:10px">סיכום עובדים</div><table class="table"><thead><tr><th>עובד</th><th>שיבוצים בשבוע</th><th>שיבוצים בחודש</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function employeesHtml(){
  if(session.role!=='manager')return '';
  const rows=EMPLOYEES.map(n=>`<tr><td>${esc(n)}</td><td><span class="badge employee">עובד</span></td><td>${state.users[n].pinHash?'מוגדר':'טרם הוגדר'}</td><td><button class="btn smallbtn ghost" data-reset-pin="${esc(n)}">איפוס PIN</button></td></tr>`).join('');
  return `<div class="card table-wrap"><div class="week-title" style="margin-bottom:10px">20 עובדים</div><table class="table"><thead><tr><th>שם</th><th>הרשאה</th><th>PIN</th><th>פעולה</th></tr></thead><tbody>${rows}</tbody></table></div><div class="notice info" style="margin-top:12px">המנהל אינו חלק ממאגר 20 העובדים ולכן אינו מופיע בשיבוץ.</div>`;
}
function statusLabel(s){return s==='approved'?'אושרה':s==='rejected'?'נדחתה':'ממתינה'}

function bindMain(){
  document.getElementById('logoutBtn').onclick=()=>{session=null;activeTab='schedule';render()};
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;render()});
  if(activeTab==='schedule') bindSchedule(); if(activeTab==='swaps')bindSwaps(); if(activeTab==='employees')bindEmployees();
}
function bindSchedule(){
  document.querySelectorAll('[data-week]').forEach(b=>b.onclick=()=>{if(b.dataset.week==='prev')currentWeek=addDays(currentWeek,-7);else if(b.dataset.week==='next')currentWeek=addDays(currentWeek,7);else currentWeek=weekStart(new Date());render()});
  if(session.role!=='manager')return;
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const k=b.dataset.add,st=b.dataset.station,sel=document.querySelector(`[data-select="${k}-${st}"]`),name=sel.value;if(!name)return;const s=scheduleFor(k);if(isOff(name,k)){alert('העובד מסומן בחופש ביום זה.');return}if(anyAssignment(name,k)){alert('העובד כבר משובץ ביום זה.');return}state.schedules[k]=s;s[st].push(name);audit('שיבוץ עובד',`${name} · ${k} · ${st}`);save();render()});
  document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{const {remove:name,date:k,station:st}=b.dataset;const s=scheduleFor(k);s[st]=s[st].filter(x=>x!==name);state.schedules[k]=s;audit('הסרת שיבוץ',`${name} · ${k} · ${st}`);save();render()});
  document.querySelectorAll('[data-offday]').forEach(b=>b.onclick=()=>{modal={type:'offday',date:b.dataset.offday};renderModal()});
  document.getElementById('autoFillBtn').onclick=autoFillWeek;
  document.getElementById('clearWeekBtn').onclick=()=>{if(!confirm('לנקות את כל השיבוצים בשבוע המוצג?'))return;for(let i=0;i<5;i++)delete state.schedules[dateKey(addDays(currentWeek,i))];audit('ניקוי שבוע',dateKey(currentWeek));save();render()};
}
function autoFillWeek(){
  const load={};EMPLOYEES.forEach(n=>load[n]=0);
  Object.values(state.schedules).forEach(s=>STATIONS.forEach(st=>s[st.id].forEach(n=>load[n]=(load[n]||0)+1)));
  for(let i=0;i<5;i++){const k=dateKey(addDays(currentWeek,i)),s=scheduleFor(k);STATIONS.forEach(st=>{while(s[st.id].length<st.capacity){const candidates=EMPLOYEES.filter(n=>!isOff(n,k)&&!anyAssignedInSchedule(n,s)).sort((a,b)=>load[a]-load[b]||a.localeCompare(b,'he'));if(!candidates.length)break;const n=candidates[0];s[st.id].push(n);load[n]++;}});state.schedules[k]=s}
  audit('שיבוץ אוטומטי',dateKey(currentWeek));save();render();
}
function anyAssignedInSchedule(name,s){return STATIONS.some(st=>s[st.id].includes(name))}
function bindSwaps(){
  if(session.role==='employee'){const b=document.getElementById('newSwapBtn');if(b)b.onclick=()=>{modal={type:'swap'};renderModal()}}
  document.querySelectorAll('[data-swap-approve]').forEach(b=>b.onclick=()=>approveSwap(b.dataset.swapApprove));
  document.querySelectorAll('[data-swap-reject]').forEach(b=>b.onclick=()=>{const s=state.swaps.find(x=>x.id===b.dataset.swapReject);if(s){s.status='rejected';audit('דחיית החלפה',s.id);save();render()}});
}
function approveSwap(id){
  const req=state.swaps.find(x=>x.id===id);if(!req)return;const s=scheduleFor(req.date);if(!s[req.station].includes(req.requester)){alert('המבקש כבר אינו משובץ בעמדה הזו.');return}if(!req.target||isOff(req.target,req.date)||anyAssignment(req.target,req.date)){alert('לא ניתן לבצע את ההחלפה: המחליף בחופש או כבר משובץ.');return}
  s[req.station]=s[req.station].map(n=>n===req.requester?req.target:n);state.schedules[req.date]=s;req.status='approved';audit('אישור החלפה',`${req.requester} → ${req.target} · ${req.date}`);save();render();
}
function bindEmployees(){document.querySelectorAll('[data-reset-pin]').forEach(b=>b.onclick=()=>{if(!confirm(`לאפס PIN ל-${b.dataset.resetPin}? המשתמש יגדיר PIN חדש בכניסה הבאה.`))return;const u=state.users[b.dataset.resetPin];u.pinHash=null;u.salt=null;audit('איפוס PIN',u.name);save();render()})}

function renderModal(){
  document.querySelector('.modal-backdrop')?.remove(); const wrap=document.createElement('div');wrap.className='modal-backdrop';wrap.innerHTML=modalHtml();document.body.appendChild(wrap);wrap.onclick=e=>{if(e.target===wrap){modal=null;wrap.remove()}};document.getElementById('modalCancel').onclick=()=>{modal=null;wrap.remove()};
  if(modal.type==='offday')bindOffModal(wrap); if(modal.type==='swap')bindSwapModal(wrap);
}
function modalHtml(){
  if(modal.type==='offday'){const k=modal.date;return `<div class="modal"><h2>ימי חופש – ${formatDate(parseKey(k))}</h2><div class="stack">${EMPLOYEES.map(n=>`<label class="person-chip"><span>${esc(n)}${anyAssignment(n,k)?' <span class="small">(משובץ)</span>':''}</span><input type="checkbox" data-off-check="${esc(n)}" ${isOff(n,k)?'checked':''}></label>`).join('')}</div><div class="divider"></div><div class="actions"><button class="btn primary" id="saveOffBtn">שמור</button><button class="btn" id="modalCancel">ביטול</button></div></div>`}
  const assignments=[];for(const [k,s] of Object.entries(state.schedules))STATIONS.forEach(st=>{if(s[st.id].includes(session.name))assignments.push({k,st:st.id})}); assignments.sort((a,b)=>a.k.localeCompare(b.k));
  return `<div class="modal"><h2>בקשת החלפה</h2><form id="swapForm" class="stack"><div class="field"><label>משמרת שלך</label><select id="swapAssignment" required><option value="">בחר…</option>${assignments.map(a=>`<option value="${a.k}|${a.st}">${formatDate(parseKey(a.k))} · ${esc(STATIONS.find(x=>x.id===a.st).name)}</option>`).join('')}</select></div><div class="field"><label>עובד מחליף מבוקש</label><select id="swapTarget" required><option value="">בחר…</option>${EMPLOYEES.filter(n=>n!==session.name).map(n=>`<option>${esc(n)}</option>`).join('')}</select></div><div id="swapMsg"></div><div class="actions"><button class="btn primary" type="submit">שלח בקשה</button><button class="btn" type="button" id="modalCancel">ביטול</button></div></form></div>`;
}
function bindOffModal(wrap){document.getElementById('saveOffBtn').onclick=()=>{const k=modal.date;const off=[...wrap.querySelectorAll('[data-off-check]:checked')].map(x=>x.dataset.offCheck);const conflicts=off.filter(n=>anyAssignment(n,k));if(conflicts.length&&!confirm(`העובדים הבאים כבר משובצים: ${conflicts.join(', ')}. סימון חופש יסיר אותם מהשיבוץ. להמשיך?`))return;const s=scheduleFor(k);conflicts.forEach(n=>STATIONS.forEach(st=>s[st.id]=s[st.id].filter(x=>x!==n)));state.schedules[k]=s;state.offDays[k]=off;audit('עדכון ימי חופש',k);save();modal=null;wrap.remove();render()}}
function bindSwapModal(wrap){document.getElementById('swapForm').onsubmit=e=>{e.preventDefault();const [k,st]=document.getElementById('swapAssignment').value.split('|');const target=document.getElementById('swapTarget').value;const msg=document.getElementById('swapMsg');if(!k||!st||!target)return;if(isOff(target,k)){msg.innerHTML='<div class="notice error">המחליף שבחרת מסומן בחופש ביום זה.</div>';return}if(anyAssignment(target,k)){msg.innerHTML='<div class="notice error">המחליף שבחרת כבר משובץ ביום זה.</div>';return}state.swaps.unshift({id:crypto.randomUUID(),requester:session.name,target,date:k,station:st,status:'pending',createdAt:new Date().toISOString()});audit('בקשת החלפה',`${session.name} → ${target} · ${k}`);save();modal=null;wrap.remove();activeTab='swaps';render()}}

render();

</script>
</body>
</html>
